name: Check secrets (temporary)
on:
  push:
    branches: ["claude/new-session-x73uno"]
    paths: [".github/workflows/check-secrets.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Report which secrets are set (values are never printed)
        run: |
          missing=0
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -n "${!v}" ]; then echo "SET     $v (length ${#v})" | sed 's/ (length.*//'; else echo "MISSING $v"; missing=1; fi
          done
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ks.keystore 2>/dev/null && echo "KEYSTORE_BASE64 decodes: yes" || echo "KEYSTORE_BASE64 decodes: NO"
            if keytool -list -keystore ks.keystore -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -qi "$KEY_ALIAS"; then
              echo "keystore opens with KEYSTORE_PASSWORD and contains alias KEY_ALIAS: yes"
            else
              echo "keystore opens with KEYSTORE_PASSWORD and contains alias KEY_ALIAS: NO"; missing=1
            fi
            rm -f ks.keystore
          fi
          exit $missing
