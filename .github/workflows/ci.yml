name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  agent:
    name: Agent (lint + tests, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: System packages for the X11 integration tests
        working-directory: .
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb xdotool xclip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps -e .
          pip install pytest pytest-asyncio ruff
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: python -m pytest -q

  app:
    name: App (lint + typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test

  prebuild-check:
    name: App (expo prebuild sanity)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Prebuild Android and check the manifest
        run: |
          npx expo prebuild --platform android --no-install --clean
          grep -q 'dev.pewpiece.golesync' android/app/build.gradle
          grep -q 'usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml
          grep -q 'android.intent.action.SEND' android/app/src/main/AndroidManifest.xml
          ! grep -q 'RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
